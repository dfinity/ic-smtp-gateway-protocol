[workspace]
members = [
    "crates/protocol",
    "examples/mock-canister",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/dfinity/ic-smtp-gateway-protocol"

[workspace.dependencies]
candid = "0.10"
candid_parser = "0.4"
ic-cdk = "0.20"
ic-smtp-gateway-protocol = { version = "0.1.0", path = "crates/protocol" }
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
