name: Publish ic-smtp-gateway-protocol to crates.io

on:
  workflow_dispatch:

jobs:
  publish-ic-smtp-gateway-protocol:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write # Required for OIDC token exchange

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Trusted publishing. This requires the crate to already exist on
      # crates.io with this repository registered as a publisher, so the very
      # first release has to be pushed by hand with a token.
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth

      - run: cargo publish --package ic-smtp-gateway-protocol
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
